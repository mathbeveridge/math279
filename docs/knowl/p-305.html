<p>Pick any \(z \in Z\text{.}\) By (2), there exists \(y \in Y\) such that \(g(y)=z\text{.}\) Now by (1), there exists \(x \in X\) such that \(f(x)=y\text{.}\) So we have \(g \circ f (x) = g(f(x)) = g(y) = z\text{.}\) This completes the proof.</p>
